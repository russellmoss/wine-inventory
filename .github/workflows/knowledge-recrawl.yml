name: Knowledge Re-crawl

# LOOP 5 — Knowledge-base freshness (Plan 079 Unit 12). See docs/AUTOMATION.md.
# Monthly, re-crawls the active knowledge sources: conditional GET (304 = no re-embed), changed pages
# re-embed into a new revision with an atomic flip, new pages are added, and pages that 404 are
# tombstoned (status='withdrawn', kept for audit, excluded from retrieval). Mutates the GLOBAL corpus
# ONLY — no tenant data — via the owner connection; opens a GitHub ISSUE with the run summary. It NEVER
# touches code and NEVER merges main. Reversible + self-correcting (a re-reached doc goes active again).

on:
  schedule:
    - cron: '0 9 1 * *'  # 09:00 UTC on the 1st of each month (~every 4 weeks; conditional GET means
                         # unchanged pages don't re-embed — only changed/new/removed docs cost anything)
  workflow_dispatch:
    inputs:
      max_docs:
        description: 'Cap documents processed (smoke run). Blank = full corpus.'
        required: false
        default: ''

# Single-flight: never let two re-crawls mutate the corpus at once (revision races, double fetches).
concurrency:
  group: knowledge-recrawl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  recrawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # full corpus crawl (~1k docs, polite 1s/fetch) + existence checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Write .env (owner connection + Voyage key)
        env:
          DB_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          {
            printf 'DATABASE_URL_UNPOOLED=%s\n' "$DB_UNPOOLED"
            printf 'DATABASE_URL=%s\n' "$DB_UNPOOLED"
            printf 'VOYAGE_API_KEY=%s\n' "$VOYAGE_API_KEY"
          } > .env

      - name: Re-crawl the knowledge corpus
        id: recrawl
        env:
          KB_MAX_DOCS: ${{ github.event.inputs.max_docs }}
        run: |
          set -o pipefail
          # Plan 085 — capture the exit code instead of letting it abort the step.
          # Actions runs this as `bash -e`, so a failing pipe used to kill the step ON THIS LINE:
          # the grep below never ran, summary.json was never written, and the `if: always()` issue
          # step then died on `cat summary.json` before reaching `gh issue create`. A deliberate
          # non-zero exit (the script's darkSources gate) would have produced a bare red X with no
          # summary and no issue — the exact opposite of failing loudly. Now the summary is always
          # extracted and published, and the step still fails at the end.
          rc=0
          npm run --silent recrawl:knowledge 2>&1 | tee recrawl.log || rc=$?
          # Pull the machine-readable summary line the script prints (emitted BEFORE any exit).
          grep '::KB_RECRAWL_SUMMARY::' recrawl.log | sed 's/.*::KB_RECRAWL_SUMMARY:://' | tail -1 > summary.json || true
          [ -s summary.json ] || echo '{"error":"no summary emitted — see the run log"}' > summary.json
          echo "summary=$(cat summary.json)" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Refresh the pesticide registration + resistance master
        id: pesticide
        if: always()
        run: |
          set -o pipefail
          # Spray S2 Unit 10. RE-DERIVATION IS MANDATORY, not optional (runbook §3.17): the derived
          # resistance table has NO vendor update SLA, so a monthly ingest that never re-derives is
          # precisely the drift the accepted risk describes. Same capture pattern as the recrawl step
          # above — the summary is extracted even when the run fails, so the issue always publishes.
          #
          # This is its OWN step rather than riding the source's crawlCadence because epa-pesticide is
          # autoCrawl:false (nothing is crawled — the data is relational) and crawlCadence is
          # documentation only; nothing schedules from it.
          rc=0
          npm run --silent ingest:appril 2>&1 | tee pesticide.log || rc=$?
          npm run --silent ingest:cdpr 2>&1 | tee -a pesticide.log || rc=$?
          npm run --silent derive:resistance 2>&1 | tee -a pesticide.log || rc=$?
          {
            grep '::PESTICIDE_INGEST_SUMMARY::' pesticide.log | sed 's/.*::PESTICIDE_INGEST_SUMMARY:://' | tail -1
            grep '::PESTICIDE_CDPR_SUMMARY::' pesticide.log | sed 's/.*::PESTICIDE_CDPR_SUMMARY:://' | tail -1
            grep '::PESTICIDE_RESISTANCE_SUMMARY::' pesticide.log | sed 's/.*::PESTICIDE_RESISTANCE_SUMMARY:://' | tail -1
          } > pesticide-summary.json || true
          [ -s pesticide-summary.json ] || echo '{"error":"no pesticide summary emitted — see the run log"}' > pesticide-summary.json
          # The coverage DELTA a grower's PCA would actually read: products withdrawn from the source,
          # AIs whose resolution changed, and any drift between the committed artifact and the live
          # extension table (the derive step prints "~ DRIFT" lines).
          grep -E '^\s+[!~]' pesticide.log | head -40 > pesticide-delta.txt || true
          # Spray S2b Unit 9 — the product-facts drift detector, in this SAME step rather than a new
          # workflow. It runs the coverage report ONLY: it never writes a curated value, because a
          # curated row's reviewer is a human signature on a legal fact (rule §3.1, KD-8 — the
          # monthly job is a DETECTOR, not an unreviewed auto-update).
          #
          # The number it publishes is the trigger for the structured-label-data purchase decision
          # (runbook §12 q5), and the `stale=` field is the early warning for KD-10: a group past
          # reviewDueAt stops answering, so curation falling behind degrades the product silently
          # unless someone is told first.
          npm run --silent report:product-facts-coverage 2>&1 | tee -a pesticide.log || true
          grep '::PESTICIDE_FACTS_SUMMARY::' pesticide.log | sed 's/.*::PESTICIDE_FACTS_SUMMARY:://' | tail -1 >> pesticide-summary.json || true
          exit $rc

      - name: Open freshness issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          # This step is `if: always()`, so it must survive the recrawl step having failed —
          # including the case where summary.json was never produced at all.
          [ -s summary.json ] || echo '{"error":"no summary emitted — see the run log"}' > summary.json
          {
            echo "Automated knowledge-base re-crawl (Plan 079 Unit 12). Mutates the GLOBAL corpus only; never merges code."
            echo ""
            echo '```json'
            cat summary.json || true
            echo '```'
            echo ""
            echo "Review: any **withdrawn** docs (a source removed the page?) and **newCandidateDomains** (new trusted-source candidates queued to CandidateSource). Re-embeds and tombstones are reversible."
            echo ""
            echo "**Bot walls (plan 085).** \`skippedChallenge\` counts fetches that returned a WAF interstitial instead of the document, per source; those are skipped before persisting, never indexed. \`tombstoneExcludedSources\` lists sources held out of the tombstone pass because a challenge makes \"not reached\" indistinguishable from \"removed\". **\`darkSources\` is the one that FAILS this job**: challenged AND zero documents indexed, which usually means the runner's datacenter IP is refused where a residential IP is not."
            echo ""
            echo "## Pesticide registration + resistance (Spray S2 Unit 10)"
            echo ""
            echo '```json'
            cat pesticide-summary.json 2>/dev/null || echo '{"error":"step did not run"}'
            echo '```'
            echo ""
            echo "### Coverage delta"
            echo ""
            echo '```'
            [ -s pesticide-delta.txt ] && cat pesticide-delta.txt || echo "(no withdrawals, skips, or source drift this run)"
            echo '```'
            echo ""
            echo "Review, in priority order: **\`productsWithdrawn\`** (a de-registered product must stop answering \"registered\" — PEST-1/K14); any **\`~ DRIFT\`** line (the live extension table now disagrees with the committed \`resistance-codes.json\` — a HUMAN re-reviews and re-commits the artifact, the job never auto-updates it); **\`coverage.gap\`** and **\`coverage.fungicideScoped.gap\`** rising (new AIs land in GAP by construction and each one is a product a grower cannot get a rotation answer for); and **\`coverage.biologicalsShareOfGap\`**, which is the number that turns the Cornell guide from an opinion into a purchasing decision."
          } > issue-body.md
          gh issue create \
            --title "KB re-crawl $DATE" \
            --body-file issue-body.md \
            --label knowledge-base || true
